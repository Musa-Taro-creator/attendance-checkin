<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Check in</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8a8a8a);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 32px 24px; gap: 14px; }
    .icon { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 48px; background: var(--card); }
    .icon.ok { background: #d9f2df; }
    .icon.late { background: #fdf0d2; }
    .icon.bad { background: #fadcdc; }
    h1 { font-size: 22px; font-weight: 600; margin: 4px 0 0; }
    .name { font-size: 15px; color: var(--hint); margin: 0; }
    p.msg { font-size: 15px; line-height: 1.5; color: var(--hint); margin: 0; max-width: 320px; }
    button { margin-top: 10px; border: 0; border-radius: 12px; padding: 14px 20px; font-size: 16px;
      width: 100%; max-width: 320px; background: var(--btn); color: var(--btn-text); cursor: pointer; }
    button.secondary { background: var(--card); color: var(--text); }
    .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--card);
      border-top-color: var(--btn); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
    form { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; }
    input { width: 100%; border: 1px solid var(--hint); border-radius: 12px; padding: 14px; font-size: 18px;
      text-align: center; letter-spacing: 1px; background: var(--card); color: var(--text); outline: none; }
    input:focus { border-color: var(--btn); }
    .err { color: #d93025; font-size: 14px; margin: 8px 0 0; }
    .who { width: 100%; max-width: 320px; background: var(--card); border-radius: 12px; padding: 16px;
      font-size: 18px; font-weight: 600; color: var(--text); margin: 4px 0 0; overflow-wrap: anywhere; }
    #confirm { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
<main>
  <div id="icon" class="icon"><div class="spinner"></div></div>
  <h1 id="title">Checking your location…</h1>
  <p id="name" class="name" hidden></p>
  <p id="msg" class="msg">Please wait a few seconds.</p>
  <form id="idform" hidden>
    <input id="sid" type="text" placeholder="Student ID, e.g. D20243724" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <p id="iderr" class="err" hidden></p>
    <button type="submit">Continue</button>
  </form>
  <form id="codeform" hidden>
    <input id="jcode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit code" autocomplete="off">
    <p id="codeerr" class="err" hidden></p>
    <button type="submit">Check in</button>
  </form>
  <div id="confirm" hidden>
    <p id="who" class="who"></p>
    <button id="yes" type="button">✅ Yes, that's me</button>
    <button id="no" type="button" class="secondary">✏️ No, type again</button>
  </div>
  <button id="retry" hidden>Try again</button>
  <button id="settings" hidden>Open location settings</button>
  <button id="close" class="secondary" hidden>Close</button>
</main>

<script>
  // ============ CONFIG: put your Supabase project URL here ============
  // Pinned to Singapore, next to the database, so check-in is faster.
  const API_URL = "https://ewxcsbrhybfiuqjrhuvy.supabase.co/functions/v1/checkin?forceFunctionRegion=ap-southeast-1";
  // ====================================================================

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const $ = (id) => document.getElementById(id);
  const supports = (v) => typeof tg.isVersionAtLeast === "function" && tg.isVersionAtLeast(v);

  function show(state, title, msg, name) {
    const icon = $("icon");
    icon.className = "icon " + (state === "loading" ? "" : state);
    icon.innerHTML = state === "loading" ? '<div class="spinner"></div>'
      : state === "ok" ? "✅" : state === "late" ? "⏰" : "❌";
    $("title").textContent = title;
    $("msg").textContent = msg || "";
    $("name").hidden = !name;
    $("name").textContent = name || "";
    $("retry").hidden = !(state === "bad");
    $("close").hidden = state === "loading";
    $("settings").hidden = true;
    $("idform").hidden = true;
    $("codeform").hidden = true;
    $("confirm").hidden = true;
    if (state !== "loading" && tg.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred(state === "bad" ? "error" : "success");
    }
  }

  // Same random ID every time on this phone. Used for "one check-in device per student".
  async function getDeviceId() {
    const KEY = "att_device_id";
    let id = null;
    try { id = localStorage.getItem(KEY); } catch (e) {}
    const ds = supports("9.0") ? tg.DeviceStorage : null;
    if (!id && ds) {
      id = await new Promise((res) => ds.getItem(KEY, (err, v) => res(err ? null : v)));
    }
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID()
        : Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""));
    }
    try { localStorage.setItem(KEY, id); } catch (e) {}
    if (ds) ds.setItem(KEY, id, () => {});
    return id;
  }

  // Telegram's Face ID / Touch ID device ID. Only read: the student is never asked to scan.
  // On iPhone the page's own ID (above) is different for every Telegram account; this one may not be.
  let bioIdCache;
  async function getBioId() {
    if (bioIdCache !== undefined) return bioIdCache;
    const bm = supports("7.2") ? tg.BiometricManager : null;
    if (!bm) return (bioIdCache = "");
    const ok = await withTimeout(new Promise((res) => bm.init(() => res(true))), 3000, false);
    return (bioIdCache = ok && bm.deviceId ? String(bm.deviceId) : "");
  }

  // What the phone "looks like" (model screen, iOS and Telegram version, language, time zone).
  // Many phones share it, so it's only used together with GPS to spot one phone used by two accounts.
  function getFingerprint() {
    const s = window.screen || {};
    return [
      tg.platform || "", tg.version || "",
      `${s.width}x${s.height}@${window.devicePixelRatio || 1}`,
      navigator.hardwareConcurrency || "", navigator.maxTouchPoints || "",
      navigator.language || "", Intl.DateTimeFormat().resolvedOptions().timeZone || "",
      (navigator.userAgent || "").replace(/\s+/g, " ").slice(0, 160),
    ].join("|");
  }

  class LocationDenied extends Error {}

  // Resolves with the promise's value, or with `fallback` after `ms` milliseconds.
  const withTimeout = (p, ms, fallback) =>
    Promise.race([p, new Promise((res) => setTimeout(() => res(fallback), ms))]);

  // Real GPS position (not a point picked on a map).
  // Uses Telegram's location feature; falls back to the browser's location if it isn't available or hangs.
  async function getLocation() {
    const lm = supports("8.0") ? tg.LocationManager : null;
    if (lm) {
      const inited = await withTimeout(new Promise((res) => lm.init(() => res(true))), 5000, false);
      if (inited && lm.isLocationAvailable) {
        if (lm.isAccessRequested && !lm.isAccessGranted) throw new LocationDenied();
        const TIMEOUT = {};
        const loc = await withTimeout(new Promise((res) => lm.getLocation(res)), 20000, TIMEOUT);
        if (loc && loc !== TIMEOUT) return { lat: loc.latitude, lng: loc.longitude, accuracy: loc.horizontal_accuracy || 0 };
        if (loc !== TIMEOUT && !lm.isAccessGranted) throw new LocationDenied();
        // Timed out or no position: fall back to the browser's location below.
      }
    }
    if (!navigator.geolocation) throw new Error("unavailable");
    return new Promise((res, rej) => navigator.geolocation.getCurrentPosition(
      (p) => res({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy || 0 }),
      (e) => rej(e.code === 1 ? new LocationDenied() : new Error("unavailable")),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 },
    ));
  }

  let lastLoc = null;

  // First time: the student types their Student ID once, so the bot knows who they are.
  function askStudentId(title, msg, error) {
    show("loading", title, msg);
    const icon = $("icon");
    icon.className = "icon";
    icon.textContent = "🎓";
    $("close").hidden = false;
    $("idform").hidden = false;
    $("iderr").hidden = !error;
    $("iderr").textContent = error || "";
    setTimeout(() => $("sid").focus(), 100);
  }

  let pendingCode = null;
  let joinCode = null; // the 4-digit code of an online class

  // Online class with a code: the student types the code said in the online meeting.
  function askJoinCode(title, msg, error) {
    show("loading", title, msg);
    const icon = $("icon");
    icon.className = "icon";
    icon.textContent = "🔢";
    $("close").hidden = false;
    $("codeform").hidden = false;
    $("codeerr").hidden = !error;
    $("codeerr").textContent = error || "";
    $("jcode").value = "";
    setTimeout(() => $("jcode").focus(), 100);
  }

  // Classroom classes need GPS. Returns false (and shows the problem) when there is no location.
  async function locate() {
    show("loading", "Checking your location…", "Please wait a few seconds.");
    try {
      lastLoc = await getLocation();
      return true;
    } catch (e) {
      if (e instanceof LocationDenied) {
        show("bad", "Location is off", "Allow location for Telegram, then tap Try again.");
        if (supports("8.0") && tg.LocationManager) $("settings").hidden = false;
      } else {
        show("bad", "Couldn't get your location", "Turn on GPS / location on your phone, then tap Try again.");
      }
      return false;
    }
  }

  // The server found the typed ID: show the name and let the student say "yes, that's me" before registering.
  function askConfirm(title, msg, who) {
    show("loading", title, msg);
    const icon = $("icon");
    icon.className = "icon";
    icon.textContent = "🎓";
    $("close").hidden = true;
    $("who").textContent = who || "";
    $("confirm").hidden = false;
  }

  async function send(studentCode, confirmId) {
    show("loading", studentCode ? "Checking your Student ID…" : "Checking you in…", "Please wait a few seconds.");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          initData: tg.initData,
          ...(lastLoc ? { lat: lastLoc.lat, lng: lastLoc.lng, accuracy: lastLoc.accuracy } : {}),
          ...(joinCode ? { joinCode } : {}),
          deviceId: await getDeviceId(),
          bioId: await getBioId(),
          fp: getFingerprint(),
          platform: tg.platform || "",
          ...(studentCode ? { studentCode } : {}),
          ...(confirmId ? { confirmId: true } : {}),
        }),
      });
      const r = await res.json();
      // Classroom class: get GPS now and ask again ("no_location" = older server version).
      if ((r.code === "need_location" || r.code === "no_location") && !lastLoc) {
        if (await locate()) return send(studentCode, confirmId);
        return;
      }
      if (r.code === "need_code") return askJoinCode(r.title, r.message);
      if (r.code === "wrong_code") { joinCode = null; return askJoinCode("Type the class code", "", r.message); }
      if (r.code === "need_id") return askStudentId(r.title, r.message);
      if (r.code === "confirm_id") {
        pendingCode = studentCode;
        return askConfirm(r.title, r.message, r.name);
      }
      if (r.code === "id_not_found") return askStudentId("Type your Student ID", "", r.message);
      const state = !r.ok ? "bad" : r.code === "late" ? "late" : "ok";
      show(state, r.title, r.message, r.name);
      if (state === "bad" && ["closed", "taken", "id_taken", "device_taken", "no_session", "code_locked"].includes(r.code)) {
        $("retry").hidden = true;
      }
    } catch (e) {
      show("bad", "No connection", "Check your internet, then tap Try again.");
    }
  }

  // Ask without a location first: online classes don't need one. Classroom classes answer "need_location".
  async function run() {
    show("loading", "Checking you in…", "Please wait a few seconds.");
    if (!tg.initData) {
      show("bad", "Open this from Telegram", "Tap the ✅ Check in button in your class group.");
      $("retry").hidden = true;
      return;
    }
    lastLoc = null; // fresh GPS on every try
    await send(null);
  }

  $("idform").onsubmit = (e) => {
    e.preventDefault();
    const code = $("sid").value.trim().replace(/\s+/g, "");
    if (!code) {
      $("iderr").hidden = false;
      $("iderr").textContent = "Type your Student ID first.";
      return;
    }
    send(code);
  };
  $("sid").oninput = () => { $("iderr").hidden = true; };
  $("codeform").onsubmit = (e) => {
    e.preventDefault();
    const code = $("jcode").value.replace(/\D/g, "");
    if (code.length !== 4) {
      $("codeerr").hidden = false;
      $("codeerr").textContent = "Type the 4 digits.";
      return;
    }
    joinCode = code;
    send(null);
  };
  $("jcode").oninput = () => { $("codeerr").hidden = true; };
  $("yes").onclick = () => send(pendingCode, true);
  $("no").onclick = () => {
    $("sid").value = "";
    askStudentId("Type your Student ID", "Type it again carefully.");
  };
  $("retry").onclick = run;
  $("close").onclick = () => tg.close();
  $("settings").onclick = () => tg.LocationManager.openSettings();
  run();
</script>
</body>
</html>
