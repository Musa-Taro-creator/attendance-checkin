name: Keep Supabase awake

# Once a day, touch the database so the free Supabase project never pauses (e.g. during holidays).
on:
  schedule:
    - cron: "17 2 * * *" # every day at 02:17 UTC (09:17 in Cambodia)
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS -X POST -H "content-type: application/json" \
            -d '{"ping":"keep-awake"}' \
            https://ewxcsbrhybfiuqjrhuvy.supabase.co/functions/v1/checkin
      - name: Keep this daily task switched on
        # GitHub switches off scheduled tasks after 60 days without repo changes; this keeps it on.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-awake.yml/enable"
